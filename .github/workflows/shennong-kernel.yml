name: shennong kernel (private)

# 小米14 Pro (shennong / SM8650) —— XNU + payload 构建，upstream 构建流程 + 产物下载。
# 放在你自己的 UniXNU 私有 fork 里：.github/workflows/shennong-kernel.yml
# 产物含 Apple 派生二进制，只能放在私有仓库，不要公开分发。
#
# v2 (2026-11-04)：设备仓库补丁没放对位置时自动搬正；iOS 27 profile 的 10063 诊断补丁自动跳过。

on:
  workflow_dispatch:
    inputs:
      device_repository:
        description: 设备仓库 owner/name
        required: true
        default: baihem/UniXNU-shennong
      device_ref:
        description: 设备仓库分支/提交
        required: true
        default: main
      os_major:
        description: 目标 OS 大版本（26 / 27）
        type: choice
        options: ["27", "26"]
        default: "27"
      steps:
        description: 构建到哪一步
        type: choice
        options:
          - kernel
          - kernel payload
          - kernel userdata
          - kernel userdata payload
        default: kernel payload
      xcode:
        description: macos-26 镜像的 Xcode 版本（/Applications/Xcode_<version>.app）
        required: true
        default: "26.6"

permissions:
  contents: read

concurrency:
  group: shennong-${{ github.ref }}-${{ inputs.os_major }}
  cancel-in-progress: false

env:
  HOMEBREW_NO_AUTO_UPDATE: 1
  HOMEBREW_NO_INSTALL_CLEANUP: 1
  HOMEBREW_NO_ENV_HINTS: 1

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 360
    env:
      DEVELOPER_DIR: /Applications/Xcode_${{ inputs.xcode }}.app/Contents/Developer
      UNIXNU_DEVICE: ${{ github.workspace }}/device
      DEFCONFIG: shennong_defconfig
      STEPS: ${{ inputs.steps }}
      OS_MAJOR: ${{ inputs.os_major }}
    steps:
      - name: Check out UniXNU
        uses: actions/checkout@v4
        with:
          # 必须 checkout UniXNU 上游本体。缺省 checkout 会拿本仓库（设备仓库）当成 UniXNU，
          # 于是既没有 ./unixnu 也没有 scripts/unixnu —— 这是 v1 失败的原因。
          repository: UniXNU/UniXNU
          path: unixnu
          persist-credentials: false

      - name: Check out the device repository
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.device_repository }}
          ref: ${{ inputs.device_ref }}
          path: device

      - name: Link the device into the UniXNU tree
        # 其余所有步骤都在 unixnu/ 下跑，-D 指向这份链接，所以 fetch/defconfig/build 用的是同一个 device。
        run: |
          set -euo pipefail
          test -f unixnu/unixnu
          ln -sfn "$GITHUB_WORKSPACE/device" unixnu/device
          ls unixnu/ | head -20
          echo "unixnu command: $(head -1 unixnu/unixnu)"; ls unixnu/scripts/unixnu | head -5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Normalize the device patches
        # 网页上传经常把补丁放错层（patches/xnu/ 或仓库根目录）。这里按 board.toml 的要求摆正：
        #   patches/xnu-12377/series 存在就直接用；否则用 patches/xnu/series 里引用的补丁建一份。
        run: |
          set -euo pipefail
          cd device
          grep -n 'patch_series' board.toml || true
          if [ ! -f patches/xnu-12377/series ]; then
            echo "::warning::device repo has no patches/xnu-12377/series; deriving it from patches/xnu/series"
            mkdir -p patches/xnu-12377
            rc=0
            while IFS= read -r line; do
              line="${line%%$'\r'}"
              case "$line" in ''|'#'*) continue;; esac
              echo "  series entry: $line"
              src=""
              for cand in "patches/xnu-12377/$line" "patches/xnu/$line" "$line"; do
                if [ -f "$cand" ]; then src="$cand"; break; fi
              done
              if [ -z "$src" ]; then
                echo "::error::series references '$line' but the file is nowhere in the device repo"
                rc=1
                continue
              fi
              cp "$src" "patches/xnu-12377/$line"
            done < patches/xnu/series
            [ "$rc" = 0 ] || exit 1
            cp patches/xnu/series patches/xnu-12377/series
          fi
          echo "--- patches/xnu-12377/series"
          cat patches/xnu-12377/series
          for f in patches/xnu-12377/*.patch; do
            echo "--- $f ($(wc -l < "$f") lines)"
            head -3 "$f"
          done
          grep -q 'patches/xnu-12377/series' board.toml || {
            echo "::error::board.toml does not point at patches/xnu-12377/series (upload the updated board.toml)"; exit 1; }

      - name: Drop stale XNU-10063 OS patches
        # iOS 27 profile 的 OS 层 series 仍引用 10063 时代的 zzz-boot-progress.patch，它只是诊断输出，
        # 在 12377 上打不上，会直接中断补丁链。
        working-directory: unixnu
        run: |
          set -euo pipefail
          f=$(ls profiles/os/ipados-"${OS_MAJOR}"*/patches/xnu/series 2>/dev/null | head -1 || true)
          if [ -n "$f" ]; then
            echo "OS patch series: $f"
            cp "$f" "$f.orig"
            printf '# intentionally empty: the xnu-10063 diagnostics (zzz-boot-progress) do not apply to xnu-12377\n' > "$f"
          fi

      - name: Check the inputs
        id: check
        working-directory: unixnu
        run: |
          set -euo pipefail
          [ -f ../device/board.toml ] || { echo "::error::the device repository has no board.toml"; exit 1; }
          [ -f "../device/configs/$DEFCONFIG" ] || { echo "::error::device/configs/$DEFCONFIG missing"; exit 1; }
          [ -d "$DEVELOPER_DIR" ] || { echo "::error::Xcode not found at $DEVELOPER_DIR"; ls /Applications | head; exit 1; }
          python3 - <<'PY'
          import os, sys
          sys.path.insert(0, 'scripts')
          from unixnu.cli import parser, cmd_defconfig
          from unixnu.config import Context
          ctx = Context(parser().parse_args(['defconfig', os.environ['DEFCONFIG'], '--os', os.environ['OS_MAJOR']]))
          cmd_defconfig(ctx)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write(f'board={ctx.board["board"]["name"]}\n')
              out.write(f'work={ctx.work}\n')
          print('profile:', ctx.board['board']['os_profile'], '->', ctx.work)
          PY

      - name: Install host tools
        working-directory: unixnu
        run: |
          brew install llvm lld mtools dtc
          if ! command -v unifdef >/dev/null; then
            brew install unifdef
            echo "$(brew --prefix unifdef)/bin" >> "$GITHUB_PATH"
          fi
          xcodebuild -version
          python3 --version

      - name: Fetch device modules
        working-directory: unixnu
        run: ./unixnu fetch --os "$OS_MAJOR" -D "$UNIXNU_DEVICE"

      - name: Defconfig
        working-directory: unixnu
        run: ./unixnu defconfig "$DEFCONFIG" --os "$OS_MAJOR" -D "$UNIXNU_DEVICE"
        
      - name: Allow arm64e in the XnuPrelink Mach-O reader
        # iOS 26/27 的内核产物是 arm64e（subtype 2），而 kits/XnuPrelink/native_prelink.py 只认
        # subtype 0，会在 build-sheng-platform-power 里报 "Only ordinary little-endian ARM64 is supported"。
        working-directory: unixnu
        run: |
          set -euo pipefail
          f=kits/XnuPrelink/native_prelink.py
          test -f "$f"
          python3 - "$f" <<'PY'
          import sys
          from pathlib import Path
          path = Path(sys.argv[1])
          text = path.read_text()
          old = "if (magic, cpu, subtype) != (0xfeedfacf, 0x100000c, 0):"
          new = "if magic != 0xfeedfacf or cpu != 0x100000c or subtype not in (0, 2):"
          if old in text:
              path.write_text(text.replace(old, new, 1))
              print("patched: arm64e subtype 2 now accepted")
          elif new in text:
              print("already patched")
          else:
              sys.exit("anchor not found in kits/XnuPrelink/native_prelink.py -- upstream changed, inspect manually")
          PY
          grep -n "subtype not in (0, 2)" "$f"
          
      - name: Build kernel
        # `build kernel` 先跑 bootstrap 只取编译记录，再建归档、正式编译并 prelink，不需要手动两遍。
        working-directory: unixnu
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./unixnu build kernel --os "$OS_MAJOR"

      - name: Build userdata
        if: contains(inputs.steps, 'userdata')
        working-directory: unixnu
        run: ./unixnu build userdata --os "$OS_MAJOR"

      - name: Build payload
        if: contains(inputs.steps, 'payload')
        working-directory: unixnu
        run: ./unixnu build payload --os "$OS_MAJOR"

      - name: Preflight (payload size)
        if: contains(inputs.steps, 'payload')
        working-directory: unixnu
        run: |
          set -uo pipefail
          fail=0
          found=0
          for f in out/shennong/*/*/payload/payload.img; do
            [ -f "$f" ] || continue
            found=1
            sz=$(stat -f%z "$f")
            echo "$f $sz bytes"
            [ "$sz" = "201326592" ] || { echo "::error::$f is $sz, must be 201326592"; fail=1; }
          done
          [ "$found" = 1 ] || { echo "::error::no payload produced"; fail=1; }
          exit $fail

      - name: Patch AppleARMCPU IONameMatch (cpu -> xpu)
        if: contains(inputs.steps, 'payload')
        working-directory: unixnu
        run: |
          PAY=$(ls -t out/shennong/*/*/payload/payload.img 2>/dev/null | head -1)
          test -n "$PAY"
          python3 "$GITHUB_WORKSPACE/device/scripts/patch-applearmcpu-ioname.py" \
            --payload "$PAY" --out "${PAY%.img}-xpu.img"
          python3 "$GITHUB_WORKSPACE/device/scripts/patch-applearmcpu-ioname.py" \
            --payload "${PAY%.img}-xpu.img" --check

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shennong-${{ inputs.os_major }}-${{ github.run_attempt }}
          retention-days: 5
          if-no-files-found: warn
          path: |
            unixnu/out/shennong/*/*/payload/payload-xpu.img
            unixnu/out/shennong/*/*/payload/payload.img
            unixnu/out/shennong/*/*/payload/payload.json
            unixnu/out/shennong/*/*/kernel/kernel.macho*
            unixnu/out/shennong/*/*/logs/*.log

      - name: Summary
        if: always()
        working-directory: unixnu
        run: |
          {
            echo "## shennong build (OS ${{ inputs.os_major }}, ${{ inputs.steps }})"
            echo '```'
            ls -l out/shennong/*/*/payload/payload*.img 2>/dev/null || echo "no payload"
            ls -l out/shennong/*/*/kernel/kernel.macho* 2>/dev/null || echo "no kernel"
            ls out/shennong/*/*/logs 2>/dev/null | head -30
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
